server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: qualquer rota do React Router cai no index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A API atras do mesmo host: sem origem cruzada, o CORS deixa de existir
    # em producao. `api` e o nome do servico no docker-compose.
    location ~ ^/(api|docs|redoc|health|openapi.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os assets do Vite tem hash no nome: podem ser cacheados sem medo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
