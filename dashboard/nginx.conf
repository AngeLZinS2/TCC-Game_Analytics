server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS embutido do Docker, com TTL curto.
    #
    # Sem isto o nginx resolve `api` UMA vez, quando carrega a configuracao, e
    # guarda o IP para sempre. Recriar o container da API - o que
    # `docker compose up --build api` faz - lhe da um IP novo, e o nginx
    # continua discando o antigo: 502 em toda a aplicacao, com a API
    # respondendo 200 na porta 8000. Aconteceu, e o log mostrava
    # `upstream: http://172.19.0.3:8000` enquanto a API ja estava em .0.5.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA: qualquer rota do React Router cai no index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A API atras do mesmo host: sem origem cruzada, o CORS deixa de existir
    # em producao. `api` e o nome do servico no docker-compose.
    location ~ ^/(api|docs|redoc|health|openapi.json) {
        # O nome vai numa VARIAVEL de proposito: e o que obriga o nginx a
        # reconsultar o DNS em vez de usar o IP congelado na inicializacao.
        # Com `proxy_pass http://api:8000` literal, o `resolver` acima nao teria
        # efeito nenhum.
        set $api_upstream api;
        # Com variavel no `proxy_pass`, o URI precisa ser explicito - o nginx
        # nao repassa sozinho. `$request_uri` traz caminho e query string como
        # o cliente mandou.
        proxy_pass http://$api_upstream:8000$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A coleta sob demanda (`POST /api/steam/coletar`) leva ~6s, e o
        # assistente espera o OpenRouter, que passa de 30s. O padrao de 60s do
        # nginx cobre os dois, mas deixar explicito evita que uma mudanca de
        # imagem base encurte isso em silencio.
        proxy_read_timeout 120s;
    }

    # Os assets do Vite tem hash no nome: podem ser cacheados sem medo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
